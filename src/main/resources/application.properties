spring.application.name=pulsecheck
server.port=${SERVER_PORT:8080}

# Loads SERVER_PORT, DB_URL, DB_USERNAME and DB_PASSWORD from a local .env file.
# Real environment variables with the same names take precedence.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# update: Hibernate creates/alters tables to match entities. Fine for development;
# production systems use versioned migrations instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Health checks: max time to open a connection, and max time to wait for the full response.
pulsecheck.health-check.connect-timeout=3s
pulsecheck.health-check.request-timeout=5s
